# SearXNG per la ricerca di foto dei luoghi (solo rete interna di TripShare, nessuna porta pubblica).
# Si parte dalle impostazioni predefinite complete: togliere motori con "keep_only" rompe quelli
# che ne ereditano la rete (es. "qwant images" usa la rete di "qwant"). I motori da interrogare
# li sceglie TripShare a ogni ricerca (parametro "engines").
use_default_settings: true
search:
  safe_search: 1
  formats:
    - html
    - json
server:
  # Il segreto vero arriva da SEARXNG_SECRET (variabile d'ambiente del servizio).
  secret_key: 'cambiami'
  limiter: false
  image_proxy: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
