packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@tailwindcss/oxide'
  - msgpackr-extract
# Binari nativi (es. sharp) per tutte le architetture delle immagini Docker, più quella locale.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64, arm64]
  libc: [current, musl]
