    <style id="boot-css">
      /* Schermata di avvio: compare subito, prima che l'app sia caricata. */
      html {
        background: #0b1220;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: #fff;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Inter,
          sans-serif;
        background: radial-gradient(120% 80% at 50% 0%, #153650 0%, #0b1220 62%);
      }
      .boot img {
        width: 104px;
        height: 104px;
        border-radius: 28px;
        box-shadow: 0 18px 50px rgb(20 184 166 / 0.35);
      }
      .boot b {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .boot i {
        font-style: normal;
        background: linear-gradient(90deg, #14b8a6, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .boot s {
        position: relative;
        width: 46px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.16);
        text-decoration: none;
      }
      .boot s::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #14b8a6, #818cf8);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot s::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <script>
      // Applica il tema prima del primo render per evitare il lampo di colore.
      try {
        var t = localStorage.getItem('tripshare-theme') || 'system';
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>

    <div id="root">

        <b>Trip<i>Share</i></b>
